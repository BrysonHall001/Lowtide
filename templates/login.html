{% extends "base.html" %}
{% block title %}Log in · Lowtide{% endblock %}
{% block body %}
<section class="login">
  <h1 class="mark big">Lowtide</h1>
  <p class="lede">Calm jobs, found for you.</p>
  {% if missing %}
    <p class="flash">This app has no password yet. Add an <strong>APP_PASSWORD</strong> environment variable in Render, then reload.</p>
  {% else %}
  <form method="post">
    <label for="pw">Password</label>
    <input id="pw" type="password" name="password" autofocus required>
    <button class="btn primary" type="submit">Log in</button>
  </form>
  {% endif %}
</section>
{% endblock %}
